# ===========================================================================
#  Venus Chicken Centers — Operations Console
# ===========================================================================
#
#  A) Use your own PostgreSQL (Neon, RDS, anywhere)
#         docker compose up -d --build
#     Reads DATABASE_URL from .env.
#
#  B) Everything self-contained, including the database
#         docker compose --profile localdb up -d --build
#     Starts PostgreSQL 16 in a container with a persistent volume.
#
#  C) Add a database browser on http://localhost:${ADMINER_PORT:-8080}
#         docker compose --profile tools up -d
#
#  D) Take a backup into ./backups
#         docker compose --profile backup run --rm db-backup
#
#  Then open  http://localhost:${APP_PORT:-8000}   (set APP_PORT in .env)
#
#  Useful:
#     docker compose logs -f web
#     docker compose exec web python manage.py create-admin
#     docker compose exec web python manage.py seed
#     docker compose down            (stop; keeps the data volume)
#     docker compose down -v         (stop and DELETE the local database)
# ===========================================================================

name: venus

# --------------------------------------------------------------------------
# Settings shared by the app containers
# --------------------------------------------------------------------------
x-app-env: &app-env
  # With --profile localdb this falls back to the bundled Postgres.
  # Otherwise DATABASE_URL from .env wins.
  DATABASE_URL: ${DATABASE_URL:-postgresql://venus:venus@db:5432/venus}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set — copy .env.example to .env and fill it in}
  FLASK_DEBUG: "0"
  TZ: ${TZ:-Asia/Kolkata}

  # Session behaviour
  COOKIE_SECURE: ${COOKIE_SECURE:-0}          # set to 1 once you serve over HTTPS
  IDLE_ADMIN_MIN: ${IDLE_ADMIN_MIN:-2}
  IDLE_SUPERVISOR_MIN: ${IDLE_SUPERVISOR_MIN:-10}

  # Connection pool — Neon closes idle connections, so recycle before it does
  # What the app listens on inside the container
  PORT: ${PORT:-8000}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  WEB_THREADS: ${WEB_THREADS:-4}

  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}

  # Start-up behaviour, handled by docker/entrypoint.sh
  WAIT_FOR_DB: ${WAIT_FOR_DB:-1}              # block until the database answers
  DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-90}
  AUTO_INIT_DB: ${AUTO_INIT_DB:-1}            # create any missing tables

  # Optional first-boot administrator. Leave blank to create one by hand with
  #   docker compose exec web python manage.py create-admin
  ADMIN_NAME: ${ADMIN_NAME:-System Admin}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------------------
  # The Flask application, served by gunicorn
  # ------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: venus-erp:latest
    container_name: venus-web
    restart: unless-stopped
    init: true                      # reap zombie processes, forward signals
    stop_grace_period: 30s
    ports:
      # host:container — both follow .env, so nothing is pinned to 8000
      - "${APP_PORT:-8000}:${PORT:-8000}"
    environment: *app-env
    # No depends_on: the entrypoint waits for the database itself, which keeps
    # this file working on every Compose v2 and in both profiles.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${PORT:-8000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    read_only: true                 # the app writes nothing to disk
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    networks: [venusnet]

  # ------------------------------------------------------------------------
  # Bundled PostgreSQL — only with:  --profile localdb
  # ------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: venus-db
    profiles: ["localdb"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-venus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venus}
      POSTGRES_DB: ${POSTGRES_DB:-venus}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - venus-pgdata:/var/lib/postgresql/data
    ports:
      # localhost only — not reachable from the rest of the network
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-venus} -d ${POSTGRES_DB:-venus}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging
    networks: [venusnet]

  # ------------------------------------------------------------------------
  # Database browser — only with:  --profile tools
  # ------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: venus-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
      TZ: ${TZ:-Asia/Kolkata}
    logging: *default-logging
    networks: [venusnet]

  # ------------------------------------------------------------------------
  # One-shot backup into ./backups — only with:  --profile backup
  #     docker compose --profile backup run --rm db-backup
  # Works against the bundled database or your own, whatever DATABASE_URL is.
  # ------------------------------------------------------------------------
  db-backup:
    image: postgres:16-alpine
    container_name: venus-backup
    profiles: ["backup"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://venus:venus@db:5432/venus}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        stamp=$$(date +%Y%m%d-%H%M%S)
        echo "Dumping to /backups/venus-$$stamp.sql.gz"
        pg_dump "$$DATABASE_URL" | gzip > "/backups/venus-$$stamp.sql.gz"
        echo "Done: $$(ls -lh /backups/venus-$$stamp.sql.gz | awk '{print $$5}')"
    networks: [venusnet]

volumes:
  venus-pgdata:
    name: venus-pgdata

networks:
  venusnet:
    name: venus-net
    driver: bridge
